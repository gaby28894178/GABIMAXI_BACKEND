<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <style>
      .title{font:700 20px system-ui,Segoe UI,Arial,sans-serif;fill:#111827}
      .label{font:600 14px system-ui,Segoe UI,Arial,sans-serif;fill:#111827}
      .small{font:500 12px system-ui,Segoe UI,Arial,sans-serif;fill:#111827}
      .muted{fill:#6b7280}
      .box{fill:#ffffff;stroke:#111827;stroke-width:1.5;rx:12;ry:12}
      .usecase{fill:#f8fafc;stroke:#111827;stroke-width:1.5}
      .line{stroke:#111827;stroke-width:1.5;fill:none}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
  </defs>

  <text x="24" y="40" class="title">Casos de uso + endpoints (Backend)</text>

  <rect x="20" y="70" width="1160" height="420" class="box"/>
  <text x="40" y="105" class="label muted">Sistema: API Maxipela Turnos</text>

  <circle cx="120" cy="210" r="22" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
  <line x1="120" y1="232" x2="120" y2="300" class="line"/>
  <line x1="90" y1="255" x2="150" y2="255" class="line"/>
  <line x1="120" y1="300" x2="95" y2="340" class="line"/>
  <line x1="120" y1="300" x2="145" y2="340" class="line"/>
  <text x="92" y="370" class="label">Usuario</text>

  <ellipse cx="430" cy="170" rx="170" ry="42" class="usecase"/>
  <text x="430" y="166" text-anchor="middle" class="label">Registrarse</text>
  <text x="430" y="188" text-anchor="middle" class="small muted">POST /api/auth/register</text>

  <ellipse cx="430" cy="270" rx="170" ry="42" class="usecase"/>
  <text x="430" y="266" text-anchor="middle" class="label">Iniciar sesión</text>
  <text x="430" y="288" text-anchor="middle" class="small muted">POST /api/auth/login</text>

  <ellipse cx="430" cy="370" rx="170" ry="42" class="usecase"/>
  <text x="430" y="366" text-anchor="middle" class="label">Ver mi perfil</text>
  <text x="430" y="388" text-anchor="middle" class="small muted">GET /api/users/profile</text>

  <ellipse cx="820" cy="370" rx="190" ry="42" class="usecase"/>
  <text x="820" y="366" text-anchor="middle" class="label">Actualizar mi perfil</text>
  <text x="820" y="388" text-anchor="middle" class="small muted">PUT /api/users/profile</text>

  <rect x="700" y="235" width="240" height="70" class="box" rx="14" ry="14" fill="#eef2ff"/>
  <text x="820" y="265" text-anchor="middle" class="label">Token JWT</text>
  <text x="820" y="287" text-anchor="middle" class="small muted">Authorization: Bearer &lt;token&gt;</text>

  <line x1="152" y1="255" x2="260" y2="170" class="line" marker-end="url(#arrow)"/>
  <line x1="152" y1="265" x2="260" y2="270" class="line" marker-end="url(#arrow)"/>
  <line x1="152" y1="275" x2="260" y2="370" class="line" marker-end="url(#arrow)"/>

  <line x1="600" y1="270" x2="700" y2="270" class="line" marker-end="url(#arrow)"/>
  <text x="650" y="258" text-anchor="middle" class="small muted">devuelve</text>

  <line x1="820" y1="305" x2="560" y2="350" class="line" marker-end="url(#arrow)"/>
  <text x="675" y="338" text-anchor="middle" class="small muted">protege</text>

  <line x1="820" y1="305" x2="820" y2="328" class="line" marker-end="url(#arrow)"/>
  <text x="845" y="330" class="small muted">protege</text>
</svg>
