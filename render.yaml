services:
  - type: web
    name: maxipela-backend
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: maxipela-db
          property: connectionString

databases:
  - name: maxipela-db
    databaseName: maxipela
    user: maxipela_user
    region: oregon
    plan: free
